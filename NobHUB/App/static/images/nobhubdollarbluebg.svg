<!-- Save as bg-messaging.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B516C"></stop>
      <stop offset="1" stop-color="#474E68"></stop>
    </linearGradient>

    <!-- dollar pattern -->
    <pattern id="dollarPattern" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="transparent"></rect>

      <!-- medium symbols -->
      <text x="32" y="60" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#DDE6ED" fill-opacity="0.28" transform="rotate(-10 32 60)">$</text>
      <text x="100" y="90" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#DDE6ED" fill-opacity="0.22" transform="rotate(8 100 90)">$</text>

      <!-- small faded symbol -->
      <text x="120" y="36" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#DDE6ED" fill-opacity="0.18" transform="rotate(15 120 36)">$</text>

      <!-- large faint symbol (adds depth) -->
      <text x="60" y="130" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#DDE6ED" fill-opacity="0.12" transform="rotate(-5 60 130)">$</text>
    </pattern>

    <!-- soft vignette to darken edges slightly -->
    <radialGradient id="vignette" cx="50%" cy="20%" r="80%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.0"></stop>
      <stop offset="1" stop-color="#000000" stop-opacity="0.1"></stop>
    </radialGradient>

    <!-- faint texture -->
    <filter id="grain" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise"></feTurbulence>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"></feColorMatrix>
      <feBlend in="SourceGraphic" in2="mono" mode="overlay"></feBlend>
    </filter>
  </defs>

  <!-- base background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"></rect>

  <!-- dollar pattern overlay -->
  <rect width="100%" height="100%" fill="url(#dollarPattern)"></rect>

  <!-- soft vignette -->
  <rect width="100%" height="100%" fill="url(#vignette)"></rect>

  <!-- subtle noise -->
  <rect width="100%" height="100%" fill="transparent" filter="url(#grain)" opacity="0.03"></rect>
</svg>
